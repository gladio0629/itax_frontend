    post:
      tags: [Admin]
      summary: Tuzatish yozuvini tasdiqlash (ikkinchi xodim)
      description: |
        `approval_status: pending_approval` → `approved`. Shundan keyin yozuv daftarga tushadi
        va balansga ta'sir qiladi. Yozuvni yaratgan xodim o'zi tasdiqlay olmaydi (`403 FORBIDDEN`).
        Yozuv `pending_approval` holatida bo'lmasa — `403 FORBIDDEN` (`params.reason: not_pending`).
      operationId: adminWalletCorrectionApprove
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Tasdiqlangan tuzatish
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/wallet/correction/{id}/reject:
