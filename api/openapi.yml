  /ws:
    get:
      tags: [Notifications]
      summary: Real-vaqt bildirishnomalar (WebSocket)
      operationId: notificationsWebSocket
      description: |
        WebSocket ulanish (`wss://<api>/ws`, Kong → notification:8016). Hodisalar ro'yxati va payload'lari:
        `docs/websocket-events.md`. Token URL'da yuborilmaydi (Kong access log'i so'rov qatorini yozadi).

        **Autentifikatsiya** (ustuvorlik tartibida)
        1. **Subprotocol (tavsiya):** `new WebSocket(url, ["izgo.v1", "bearer.<access_token>"])` →
           `Sec-WebSocket-Protocol: izgo.v1, bearer.<token>`. Token ulanishdan OLDIN tekshiriladi: noto'g'ri/muddati o'tgan/
           bekor qilingan — `401`, ulanish ochilmaydi. Server faqat `izgo.v1` ni qaytaradi (bearer qismini hech qachon).
           `izgo.v1` siz `bearer.`, bir nechta yoki bo'sh `bearer.` — `401`.
        2. **Birinchi xabar:** token subprotocol'da ham, query'da ham bo'lmasa ulanish ochiladi (`izgo.v1` taklif qilingan bo'lsa
           qaytariladi) va klient `WS_AUTH_TIMEOUT` (default 5s) ichida bitta text frame yuboradi:
           `{"type":"auth","token":"<access_token>"}` (≤ 8 KiB). Muvaffaqiyat: server `{"type":"auth.ok"}` yuboradi.
           Yopish kodlari: `4401 auth_timeout`, `4401 token_invalid`, `1008 auth_malformed`, `4403 ws_connection_limit`,
           `1011 internal_error`.
        3. **Eskirgan `?token=` (deprecated):** faqat `WS_ALLOW_QUERY_TOKEN=true` (hozircha default) bo'lganda ishlaydi;
           frontend 1- yoki 2-usulga o'tgach o'chiriladi (`false` → `401`).

        **Origin:** brauzer ulanishlari `WS_ALLOWED_ORIGINS` dagi frontend domenlaridan bo'lishi kerak (aks holda `403`,
        matnli javob). Origin sarlavhasisiz (mobil ilova) ulanishlar o'tadi.

        **Ulanish limiti:** bitta foydalanuvchiga bir vaqtda `WS_MAX_CONNS` (default 3) tagacha. Ortig'i — `403 FORBIDDEN`
        (`reason: ws_connection_limit`) yoki birinchi xabar usulida `4403`.

        **Server → klient:** text frame, JSON, faqat foydalanuvchining o'z xabarlari:
        `{ "type": "order.accepted", "id": "<uuid>", "status": "accepted", "order_id": "<uuid>" }`. Matn uchun
        `GET /api/v1/notifications`. Ochiq ulanish bo'lmasa — push.

        **Klient → server:** autentifikatsiyadan keyin ma'lumot yuborilmaydi; yuborilsa `1008`. Server har `WS_PING_INTERVAL`
        (default 25s) da ping yuboradi.

        **Yopish kodlari (ulanishdan keyin)**
        - `4401 token_expired`: access token muddati tugadi — yangilab qayta ulaning.
        - `4401 session_revoked`: sessiya bekor qilindi (logout).
        - `1001 server_shutdown`: server to'xtamoqda, qayta ulaning.
        - `1008`: klient ma'lumot yubordi.
      security: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          description: '`izgo.v1, bearer.<access_token>` (1-usul)'
          schema: { type: string }
        - name: token
          in: query
          required: false
          deprecated: true
          description: Eskirgan usul (faqat `WS_ALLOW_QUERY_TOKEN=true` da). Yangi klientlar ishlatmaydi
          schema: { type: string }
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, enum: [websocket] }
        - name: Connection
          in: header
          required: true
          schema: { type: string, enum: [Upgrade] }
      responses:
        '101':
          description: Switching Protocols — WebSocket ulanishi ochildi (`Sec-WebSocket-Protocol` = `izgo.v1`, agar taklif qilingan bo'lsa)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN — ulanishlar limiti yoki ruxsat etilmagan Origin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { key: FORBIDDEN, params: { reason: ws_connection_limit } } }
        '426': { description: Upgrade sarlavhalarisiz oddiy HTTP so'rov }
        default: { $ref: '#/components/responses/InternalError' }

