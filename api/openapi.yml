      description: |
        Token shart emas. `vehicle_type` — `OrderCreate.vehicle_type` qiymati (enum o'zgarmaydi), `size_label` — klient
        tugmasi: spark=S, damas=M, labo=L, isuzu=XL, isuzu2=XXL, fura=3XL. O'lchamlar — yuk bo'limi, sm.
      operationId: deliveryVehicles
      security: []
      responses:
        '200':
