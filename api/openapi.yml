      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCancel' }
      responses:
        '200':
          description: Bekor qilingan buyurtma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
