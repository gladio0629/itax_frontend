openapi: 3.1.0
info:
  title: IZGO Taxi Platform API
  version: 0.2.0
  description: |
    IZGO taksi platformasi uchun yagona API shartnomasi (Etap 1 — skelet).
    Barcha so'rovlar Kong gateway (http://localhost:8000) orqali o'tadi.

    **Umumiy qoidalar**
    - Barcha ID lar — UUID.
    - Ro'yxatlar cursor pagination bilan: `{ "data": [...], "cursor": "..." }`.
      `cursor` = `null` bo'lsa, keyingi sahifa yo'q. Keyingi sahifa uchun `?cursor=` yuboriladi.
    - Narx, masofa, status, komissiya, qarz — FAQAT server hisoblaydi va qaytaradi.
      Ular javob sxemalarida `readOnly: true`, so'rov sxemalarida umuman yo'q.
    - Xato formati: `{ "error": { "key": "STRING", "params": {} } }`
      (kalitlar ro'yxati — `shared/errors/errors.json`).
    - Pul summalari — butun son, tiyinda (1 UZS = 100 tiyin).
    - Har qanday endpoint `500 INTERNAL_ERROR` qaytarishi mumkin (`default` javob).
    - "Ikki kishi tasdig'i" (wallet correction, tariffs) — yozuv `approval_status`
      bilan `pending_approval` holatida yaratiladi; ikkinchi xodim `POST .../{id}/approve` bilan
      tasdiqlaguncha (`pending_approval` → `approved`) kuchga kirmaydi. `POST .../{id}/reject`
      bilan rad etiladi (`pending_approval` → `rejected`).
servers:
  - url: http://localhost:8000
    description: Lokal Kong gateway

tags:
  - name: Auth
  - name: Admin Auth
  - name: Driver
  - name: Orders
  - name: Places
    description: Shaharlar, manzil qidiruvi (server tomonida), saqlangan manzillar, yo'nalishlar, yuk mashinalari
  - name: Trips
  - name: Wallet
  - name: Ratings
  - name: Notifications
  - name: Profile
  - name: Admin

security:
  - userBearer: []

paths:
  # ===================================================================== AUTH
  /api/v1/auth/otp/request:
    post:
      tags: [Auth]
      summary: OTP so'rash — telefonga SMS kod yuboriladi
      operationId: authOtpRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: SMS yuborildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestResult' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/otp/verify:
    post:
      tags: [Auth]
      summary: OTP tekshirish — access va refresh token qaytadi
      operationId: authOtpVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
      responses:
        '200':
          description: Kod to'g'ri, token juftligi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: AUTH_OTP_INVALID yoki AUTH_OTP_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid: { value: { error: { key: AUTH_OTP_INVALID, params: { attempts_left: 2 } } } }
                expired: { value: { error: { key: AUTH_OTP_EXPIRED, params: {} } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/token/refresh:
    post:
      tags: [Auth]
      summary: Refresh token bilan yangi token juftligini olish
      description: Eski refresh token bekor qilinadi (rotation).
      operationId: authTokenRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Yangi token juftligi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Chiqish — joriy refresh token bekor qilinadi
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Token bekor qilindi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }

  # =============================================================== ADMIN AUTH
  /admin/v1/auth/login/email:
    post:
      tags: [Admin Auth]
      summary: Admin kirish, 1-qadam — email'ga kod yuboriladi
      operationId: adminLoginEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginEmail' }
      responses:
        '202':
          description: Kod email'ga yuborildi (email mavjud bo'lmasa ham bir xil javob)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginChallenge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/auth/login/sms:
    post:
      tags: [Admin Auth]
      summary: Admin kirish, 2-qadam — email kodi + telefon (yoki email'siz operator — faqat telefon), SMS yuboriladi
      description: |
        Ikki ko'rinish:
        - `{challenge_id, email_code, phone}` — email'i bor xodim, 1-qadamdan keyin (xuddi shu `challenge_id` qaytadi).
        - `{phone}` — email'siz operator: email qadami o'tkazib yuboriladi, YANGI `challenge_id` qaytadi,
          keyin `/login/verify`. Email'i bor xodim bu yo'l bilan kira olmaydi.
        Noma'lum, nofaol yoki email'i bor xodim telefoni uchun ham bir xil `202` (SMS yuborilmaydi) —
        xodim mavjudligi oshkor qilinmaydi. Telefon ko'rinishida IP va telefon bo'yicha limit bor (`429`).
      operationId: adminLoginSms
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginSms' }
      responses:
        '202':
          description: SMS yuborildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLoginChallenge' }
        '401':
          description: AUTH_OTP_INVALID yoki AUTH_OTP_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/auth/login/verify:
    post:
      tags: [Admin Auth]
      summary: Admin kirish, 3-qadam — SMS kodi, admin token qaytadi
      operationId: adminLoginVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginVerify' }
      responses:
        '200':
          description: Admin token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminToken' }
        '401':
          description: AUTH_OTP_INVALID yoki AUTH_OTP_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /admin/v1/auth/logout:
    post:
      tags: [Admin Auth]
      summary: Admin chiqishi — token serverda bekor qilinadi
      description: |
        `Authorization: Bearer <admin access token>`. Token sessiyasi (`sid`) serverda bekor qilinadi: shundan keyin
        shu token bilan har qanday `/admin/v1/*` so'rovi `401`. Tana yo'q (yuborilsa e'tiborsiz). Idempotent: bekor
        qilingan, lekin muddati o'tmagan token bilan qayta chaqiruv ham `204`. Yo'lovchi/haydovchi tokeni va refresh token — `401`.
      operationId: adminLogout
      security: [{ adminBearer: [] }]
      responses:
        '204': { description: Sessiya bekor qilindi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }

  # =================================================================== DRIVER
  /api/v1/drivers/me:
    get:
      tags: [Driver]
      summary: Haydovchi profili
      operationId: driverGetMe
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Driver]
      summary: Profilni yangilash (faqat ruxsat etilgan maydonlar)
      description: |
        Faqat `DriverProfileUpdate` dagi maydonlar qabul qilinadi.
        Mashina va hujjat ma'lumotlari bu yerda o'zgarmaydi (qayta tekshiruv talab qiladi).
      operationId: driverUpdateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverProfileUpdate' }
      responses:
        '200':
          description: Yangilangan profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/drivers/me/routes:
    get:
      tags: [Driver]
      summary: Haydovchi yo'nalishlari ("Yo'nalishlarim")
      operationId: driverRoutesGet
      responses:
        '200':
          description: Yo'nalishlar (oxirgi PUT tartibida)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRoutes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Driver]
      summary: Yo'nalishlarni to'liq almashtirish
      description: |
        0..10 ta. `a_city_id ≠ b_city_id` (`routes.N.b_city_id: same_as_a`); takror (bir xil juftlik yoki `both_ways` bo'lganda
        teskari juftlik) — `routes.N: duplicate`. Shahar ID lari `GET /api/v1/cities` dan; driver servisi faqat formatni tekshiradi.
        Har PUT yangi `id` lar beradi. Bloklangan haydovchi — `403 DRIVER_BLOCKED`.
      operationId: driverRoutesPut
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverRoutesInput' }
      responses:
        '200':
          description: Saqlangan yo'nalishlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRoutes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DriverBlocked' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/drivers/me/capabilities:
    get:
      tags: [Driver]
      summary: Haydovchi imkoniyatlari ("Imkoniyatlarim")
      operationId: driverCapabilitiesGet
      responses:
        '200':
          description: Imkoniyatlar (default hammasi false / [])
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverCapabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Driver]
      summary: Imkoniyatlarni saqlash (to'rt maydon ham majburiy)
      description: "`child_seat = false` bo'lsa `child_seat_ages` bo'sh bo'lishi shart (`requires_child_seat`)."
      operationId: driverCapabilitiesPut
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverCapabilities' }
      responses:
        '200':
          description: Saqlangan imkoniyatlar (yoshlar enum tartibida)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverCapabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DriverBlocked' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/drivers/registration/step/{step}:
    post:
      tags: [Driver]
      summary: Ro'yxatdan o'tish qadami (1–4)
      description: |
        1 — shaxsiy ma'lumotlar, 2 — mashina, 3 — hujjatlar (yuklangan document_id lar),
        4 — tekshiruvga yuborish (`driver.submitted` hodisasi chiqadi).
        Qadam raqami va body turi mos kelishi shart, aks holda `VALIDATION_ERROR`.

        **Tartib:** 1–3 qadamlar istalgan tartibda yuboriladi va qayta yuborilsa ustidan yoziladi.
        `current_step` — birinchi bajarilmagan qadam. 4-qadam faqat 1, 2, 3 bajarilgandan keyin
        o'tadi, aks holda `422 VALIDATION_ERROR` (`params.fields: { step_2: incomplete, ... }`).
        Ariza yuborilgach (`pending_review` / `active`) 1–3 qadamlar yopiladi —
        `409 REGISTRATION_ALREADY_SUBMITTED`. 4-qadamni takrorlash idempotent: `200`, hodisa qayta chiqmaydi.
        `rejected` holatida qadamlar yana ochiq va ariza qayta yuboriladi.
      operationId: driverRegistrationStep
      parameters:
        - name: step
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 4 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RegistrationStep1'
                - $ref: '#/components/schemas/RegistrationStep2'
                - $ref: '#/components/schemas/RegistrationStep3'
                - $ref: '#/components/schemas/RegistrationStep4'
      responses:
        '200':
          description: Ro'yxat holati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DriverBlocked' }
        '409': { $ref: '#/components/responses/RegistrationAlreadySubmitted' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/drivers/documents/upload-url:
    post:
      tags: [Driver]
      summary: Hujjat yuklash uchun imzolangan URL olish
      operationId: driverDocumentUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadUrlRequest' }
      responses:
        '201':
          description: Imzolangan URL (qisqa muddatli)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DriverBlocked' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/drivers/documents/{id}/content:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Driver]
      summary: Hujjat faylini yuklash (imzolangan URL)
      description: |
        `upload-url` qaytargan `upload_url` aynan shu endpointga ko'rsatadi. Bearer token KERAK EMAS —
        ruxsat `expires` va `signature` query parametrlaridagi imzo bilan beriladi (S3 presigned URL kabi).
        Imzo hujjat egasi, turi, hajmi va muddatini bog'laydi.

        - Body — xom fayl baytlari; `Content-Type` `upload-url` so'rovidagi `content_type` bilan,
          hajm esa `size_bytes` bilan aynan mos bo'lishi shart.
        - Fayl turi sarlavhadan emas, fayl boshidan (magic bytes) aniqlanadi.
        - EXIF/GPS va boshqa metadata server tomonida o'chiriladi.
        - Imzo noto'g'ri yoki hujjat mavjud emas — bir xil `403 FORBIDDEN` (mavjudlik oshkor qilinmaydi);
          muddati o'tgan — `403 FORBIDDEN` (`params.reason: upload_url_expired`).
      operationId: driverDocumentUploadContent
      security: []
      parameters:
        - name: expires
          in: query
          required: true
          description: Unix vaqt (soniya) — URL amal qilish muddati
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 10485760 }
          image/png:
            schema: { type: string, format: binary, maxLength: 10485760 }
      responses:
        '204': { description: "Fayl qabul qilindi, hujjat holati — uploaded" }
        '403':
          description: FORBIDDEN (imzo noto'g'ri / muddati o'tgan) yoki DRIVER_BLOCKED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid: { value: { error: { key: FORBIDDEN, params: {} } } }
                expired: { value: { error: { key: FORBIDDEN, params: { reason: upload_url_expired } } } }
                blocked: { value: { error: { key: DRIVER_BLOCKED, params: { reason: blocked } } } }
        '409': { $ref: '#/components/responses/DocumentAlreadyUploaded' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '422':
          description: VALIDATION_ERROR — `content_type` / `size_bytes` mos emas, fayl bo'sh yoki rasm emas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { key: VALIDATION_ERROR, params: { fields: { file: invalid_image } } } }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/location/update:
    post:
      tags: [Driver]
      summary: Haydovchi joylashuvini yuborish (GPS)
      description: |
        Haydovchi ilovasi joriy koordinatani yuboradi (Kong `/api/v1/location`, faqat POST → matching-geo:8013).
        `/internal/matching/*` Kong'da yo'q. Haydovchi ID si body'da EMAS —
        access tokendan olinadi (`aud = driver`, `role = driver`); yo'lovchi tokeni — `403 FORBIDDEN` (`reason: role`).
        Joylashuv Redis'da `LOCATION_TTL` (default 2 daqiqa) saqlanadi — haydovchi undan uzoq yubormasa,
        qidiruvda ko'rinmaydi. Shubhali tezlik sakrashi (GPS soxtalashtirish) logga va anomaliyaga yoziladi,
        javobda oshkor qilinmaydi.
      operationId: driverLocationUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              additionalProperties: false
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '204': { description: Qabul qilindi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/drivers/me/status:
    get:
      tags: [Driver]
      summary: Haydovchi holati (tekshiruvda, faol, bloklangan)
      operationId: driverGetStatus
      responses:
        '200':
          description: Holat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/InternalError' }

  # =================================================================== ORDERS
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Buyurtma yaratish (narx serverdan qaytadi)
      operationId: orderCreate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Yaratilgan buyurtma (narx, masofa, status — server hisoblagan)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/QuoteNotFound' }
        '409': { $ref: '#/components/responses/QuoteConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/orders/quote:
    post:
      tags: [Orders]
      summary: Narx taklifi (buyurtmadan oldin)
      description: |
        `POST /api/v1/orders` bilan bir xil kirish (`payment_method` ixtiyoriy, `quote_id` yo'q). Javobdagi
        `quote_id` bilan yaratilgan buyurtma **aynan shu narx** bilan yoziladi — qayta hisoblanmaydi.
        Taklif `expires_at` gacha (default 10 daqiqa) va **bir marta** amal qiladi, faqat egasi uchun.
        Narxga ta'sir qiladigan maydonlar (`type`, `seats`/`seat_ids`, `car_class`, `vehicle_type`, `from`/`to` koordinatalari)
        buyurtmada taklifdagidek bo'lishi shart, aks holda `409 QUOTE_MISMATCH`. Vaqt, to'lov usuli, izoh va manzil matni
        narxga ta'sir qilmaydi — ularni o'zgartirish mumkin.
        `lines` yig'indisi doim `price` ga teng. Kalitlar klient i18n kalitlari: `quote.seatFare {count}`, `quote.carFare`,
        `quote.class.komfort|biznes|miniven {pct}`, `quote.cargoBase`, `quote.cargoDistance {km}`.
      operationId: orderQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Narx taklifi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/orders/seat-map:
    get:
      tags: [Orders]
      summary: O'rindiqlar xaritasi (yo'nalish bo'yicha)
      description: |
        To'rtta joy: `front`, `back-left`, `back-mid`, `back-right`. Narx o'rindiqlar SONIGA bog'liq, shuning uchun har joy
        narxi = 1 o'rindiq narxi. Bir mashinaga bir nechta buyurtmani jamlash (pooling) hali yo'q — har buyurtma alohida
        mashina, shuning uchun `taken` hozircha doim `false`. Tanlangan joylar `OrderCreate.seat_ids` da yuboriladi.
      operationId: orderSeatMap
      parameters:
        - { name: from_lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: from_lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: to_lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: to_lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: O'rindiqlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  # =================================================================== PLACES
  /api/v1/cities:
    get:
      tags: [Places]
      summary: Shaharlar katalogi
      description: "Token shart emas. ID lar barqaror (UUIDv5 `izgo:city:<slug>`). `Cache-Control: public, max-age=300`."
      operationId: citiesList
      security: []
      responses:
        '200':
          description: Shaharlar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CityList' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/places/search:
    get:
      tags: [Places]
      summary: Manzil qidiruvi (server tomonida)
      description: |
        Shaharlar va platforma manzillar bazasi (gazetteer) bo'yicha qidiradi; tashqi geocoder kaliti klientga chiqmaydi.
        Qidiruv katta-kichik harf va apostroflarga befarq (`fargona` → Farg'ona). Avval nomi `q` bilan boshlanganlar,
        so'ng `near_*` berilsa masofa bo'yicha. Yo'lovchi yoki haydovchi tokeni kerak.
      operationId: placesSearch
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: near_lat, in: query, required: false, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: near_lng, in: query, required: false, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: city_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Topilgan manzillar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/places/reverse:
    get:
      tags: [Places]
      summary: Nuqta → manzil nomi (teskari geocoding)
      description: |
        2 km ichidagi eng yaqin bazadagi manzil, bo'lmasa eng yaqin shahar (`kind: city`). `distance_m` — nuqtadan
        topilgan joygacha. Buyurtmada klient o'zi tanlagan koordinatani yuboradi; bu faqat nom uchun.
      operationId: placesReverse
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: Eng yaqin joy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/places/saved:
    get:
      tags: [Places]
      summary: Saqlangan manzillar (yo'lovchi)
      operationId: placesSavedList
      responses:
        '200':
          description: Saqlangan manzillar (eskidan yangiga)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedPlaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Places]
      summary: Manzilni saqlash
      description: "Foydalanuvchi boshiga ko'pi bilan 20 ta; ortig'i `403 FORBIDDEN` (`reason: saved_places_limit`)."
      operationId: placesSavedCreate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedPlaceCreate' }
      responses:
        '201':
          description: Saqlangan manzil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedPlace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/places/saved/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Places]
      summary: Saqlangan manzilni o'chirish
      operationId: placesSavedDelete
      responses:
        '204': { description: O'chirildi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/InternalError' }

  /api/v1/routes/popular:
    get:
      tags: [Places]
      summary: Mashhur shaharlararo yo'nalishlar
      description: |
        Token shart emas. `price_from` — shahar markazlari orasida 1 o'rindiq narxi (Pricing hisoblagan, 5 daqiqa kesh;
        hisoblab bo'lmasa `null`). Bu ko'rsatish uchun; buyurtma narxi faqat `orders/quote` dan.
      operationId: routesPopular
      security: []
      responses:
        '200':
          description: Yo'nalishlar
          content:
