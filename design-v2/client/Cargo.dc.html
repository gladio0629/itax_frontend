<span style="width: 30px; height: 30px; border-radius: 15px; border: 2px solid #3A4C63; color: #9FB0C3; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box">4</span>

<div style="height: 52px; padding: 4px; border-radius: 26px; background: #F3F5F8; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; box-sizing: border-box">

</div>
<div style="background: #F3F5F8; border-radius: 24px; padding: 4px 8px 4px 16px; display: flex; flex-direction: column">

<span style="width: 14px; height: 14px; border-radius: 7px; background: #2EDB85; border: 3px solid #0B1524; box-sizing: border-box; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: #5A6779">YUKNI OLISH</span><span style="font-size: 15px; font-weight: 700; color: #0B1524">Toshkent, Chilonzor 9-kvartal</span></span>

<span style="width: 13px; height: 13px; border-radius: 4px; background: #0B1524; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: #5A6779">TUSHIRISH 1</span><span style="font-size: 15px; font-weight: 700; color: #0B1524">Jizzax, Sh. Rashidov ko'chasi</span></span>
</a>
<div style="height: 50px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #DDE3EA">

<a href="Address.dc.html" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0; text-decoration: none"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: #5A6779">TUSHIRISH 2</span><span style="font-size: 15px; font-weight: 700; color: #0B1524">Guliston, markaz</span></a>
<button type="button" aria-label="Manzilni o'chirish" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6779" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>

<a href="Address.dc.html" style="height: 44px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 14px; font-weight: 800; color: #0C7A43">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0C7A43" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>

<div style="display: flex; flex-direction: column; gap: 10px">

<div style="padding: 0 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
<span style="font-size: 13px; font-weight: 600; color: #5A6779">{{cap}}</span>

</div>
</div>

</div>
</div>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: #5A6779">NARX</span>
<span style="font-size: 20px; font-weight: 800; color: #0B1524; white-space: nowrap">{{price}}</span>
</div>
<a href="CargoContacts.dc.html" style="flex-grow: 1; height: 60px; padding: 0 8px 0 22px; border-radius: 30px; background: #2EDB85; color: #0B1524; font-size: 16px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: space-between">Davom etish<span style="width: 44px; height: 44px; border-radius: 22px; background: #0B1524; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { size: 'm' };
}
renderVals() {
const D = {
s: { img: './assets/6beb6b9019561ba39a8558a23f8bef29.jpg', cap: "Qutilar va sumkalar sig'adi", kg: 'Maksimum 300 kg', price: '150 000', dims: '190 × 135 × 110 sm' },
m: { img: './assets/f797a1f922dfa20db4f6856672a2f687.jpg', cap: "Kir yuvish mashinasi va divan sig'adi", kg: 'Maksimum 700 kg', price: '250 000', dims: '260 × 155 × 150 sm' },
l: { img: './assets/8a863ca08456208fb53d5d7f3aeb997b.jpg', cap: "Bir xonali uy ko'chishiga mos", kg: 'Maksimum 1 000 kg', price: '350 000', dims: '320 × 180 × 180 sm' },
xl: { img: './assets/052da6af8e9110f79632537c1fb4f0f0.jpg', cap: "Ikki xonali uy ko'chishiga mos", kg: 'Maksimum 3 000 kg', price: '450 000', dims: '420 × 200 × 200 sm' },
xxl: { img: './assets/74ebd632e26b7b2f87350bc6c32860f8.jpg', cap: 'Uch xonali uy yoki ofis uchun', kg: 'Maksimum 5 000 kg', price: '650 000', dims: '620 × 240 × 230 sm' },
x3: { img: './assets/27c4e2a40300617556ad0ce1fe4c00a1.jpg', cap: 'XXL yetmasa, shuni tanlang', kg: 'Maksimum 8 000 kg', price: '900 000', dims: '840 × 260 × 240 sm' }
};
const cur = D[this.state.size];
const btn = (k) => {
const on = this.state.size === k;
return {
pressed: on ? 'true' : 'false',
pick: () => this.setState({ size: k }),
style: 'min-width: 0; border: none; border-radius: 18px; padding: 0; font-family: inherit; font-size: 13px; cursor: pointer; ' + (on ? 'background: #0B1524; color: #FFFFFF; font-weight: 800;' : 'background: transparent; color: #5A6779; font-weight: 700;')
};
};
return {
img: cur.img, cap: cur.cap, kg: cur.kg, alt: 'Yuk mashinasi kuzovi, ' + cur.dims,
price: cur.price + " so'm",
s: btn('s'), m: btn('m'), l: btn('l'), xl: btn('xl'), xxl: btn('xxl'), x3: btn('x3')
};
}
}
</script>
</body>
